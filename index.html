<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمن - OneSignal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .token-box { background: #e9ecef; padding: 12px; border-radius: 8px; word-break: break-all; margin-top: 15px; font-family: monospace; font-size: 14px; border: 1px dashed #999; }
    </style>
    <!-- كود OneSignal الرسمي -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "cf84a72b-50f1-48eb-809a-688cc1e63599", 
        });
        
        OneSignal.User.PushSubscription.addEventListener("change", function(subscription) {
            if (subscription.current.optedIn) {
                document.getElementById('deviceId').innerText = subscription.current.id;
            }
        });
      });
    </script>
</head>
<body>
    <div class="card">
        <h2>🛠️ لوحة الأدمن (OneSignal)</h2>
        <p>وافق على رسالة الإشعارات التي ستظهر لك في أعلى المتصفح، ثم انسخ الكود أدناه:</p>
        <div style="margin-top:20px; font-size:14px; color:#555;">رمز جهازك (Player ID):</div>
        <div id="deviceId" class="token-box">بانتظار موافقتك على الإشعارات من المتصفح...</div>
    </div>
</body>
</html>
