<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .token-box { background: #e9ecef; padding: 12px; border-radius: 8px; word-break: break-all; margin-top: 15px; font-family: monospace; font-size: 14px; border: 1px dashed #999; }
        .btn-notify { background-color: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; }
    </style>
    <script src="https://sdk.pushy.me/web/1.0.8/pushy-sdk.js"></script>
</head>
<body>

<div class="card">
    <h2>🛠️ لوحة تحكم الأدمن (أبو أمير)</h2>
    <p>قم بتفعيل الإشعارات من الزر أدناه لتسجيل هذا الهاتف كمستقبل للطلبات.</p>
    
    <button class="btn-notify" id="registerBtn">🔔 تفعيل استقبال الإشعارات</button>
    
    <p style="margin-top:20px; font-size:14px; color:#555;">رمز جهازك الحالي (Device Token):</p>
    <div id="deviceToken" class="token-box">لم يتم التفعيل بعد. اضغط على الزر أعلاه...</div>
</div>

<script>
    const registerBtn = document.getElementById('registerBtn');
    const tokenBox = document.getElementById('deviceToken');

    registerBtn.addEventListener('click', async () => {
        tokenBox.innerText = "جاري الاتصال بـ Pushy وجلب رمز الجهاز...";
        
        // التعديل هنا: كتبنا اسم الملف مباشرة ليقرأه من نفس المجلد
        Pushy.register({ 
            appId: '6669941bd5a7d7452d3a016d',
            serviceWorkerFile: 'service-worker.js' 
        }).then(function (deviceToken) {
            console.log('Pushy device token:', deviceToken);
            tokenBox.innerText = deviceToken;
            alert('تم تفعيل الإشعارات بنجاح على هذا الهاتف!');
        }).catch(function (err) {
            console.error(err);
            tokenBox.innerText = "حدث خطأ أثناء التفعيل: " + err.message;
        });
    });

    // كود داخلي للتعامل مع الإشعار عند وصوله
    Pushy.setNotificationHandler(function (data) {
        console.log('Received notification:', data);
        alert('🛍️ إشعار فوري: ' + data.message);
    });
</script>
</body>
</html>
